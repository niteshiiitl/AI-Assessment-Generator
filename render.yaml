services:
  - type: web
    name: mock-test-generator-1
    runtime: python
    buildCommand: "apt-get install -y tesseract-ocr tesseract-ocr-hin poppler-utils && pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
